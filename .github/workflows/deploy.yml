name: Redirigir GitHub Pages a alvra.com.mx

# El sitio vive en el VPS (https://alvra.com.mx, ver scripts/desplegar-vps.sh).
# GitHub Pages solo publica páginas que redirigen cada ruta al dominio.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://alvra.com.mx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
      - run: node scripts/paginas-redireccion.mjs "$SITE_URL" dist redireccion
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redireccion

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
